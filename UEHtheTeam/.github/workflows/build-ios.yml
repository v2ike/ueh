name: Build iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14 # Chạy trên máy ảo macOS mới nhất của GitHub

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Ép runner sử dụng đúng SDK .NET 8 LTS để không bị lỗi EOL của SDK 10
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 2. Cài đặt workload MAUI iOS
    - name: Install MAUI Workload
      run: dotnet workload install maui-ios

    # 3. Restore các thư viện cho dự án
    - name: Restore Dependencies
      run: dotnet restore UEHTheTeam/UEHTheTeam.csproj -f

    # 4. Tiến hành Build app iOS
    - name: Build iOS (.ipa)
      run: |
        dotnet publish UEHTheTeam/UEHTheTeam.csproj \
          -c Release \
          -f net8.0-ios \
          -p:ArchiveOnBuild=true \
          -p:EnableAssemblyILStripping=false
