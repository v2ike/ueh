name: Build MAUI iOS (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI Workload
        run: dotnet workload install maui-ios

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build and Package iOS (.ipa)
        run: |
          dotnet publish -f net8.0-ios -c Release -p:ArchiveOnBuild=true -p:EnableAssemblyAOT=false

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: |
            **/bin/Release/net8.0-ios/ios-arm64/*.ipa
            **/bin/Release/net8.0-ios/ios-arm64/publish/*.ipa
