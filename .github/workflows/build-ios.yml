name: Build MAUI iOS (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Setup SDK .NET 10
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 2. Chỉ cài workload maui-ios để tối ưu thời gian
      - name: Install MAUI iOS Workload
        run: dotnet workload install maui-ios

      # 3. Restore chuẩn theo net10.0-ios và đúng tên file project
      - name: Restore Dependencies
        run: dotnet restore UEHTheTeam/UEHTheTeam.csproj -p:TargetFramework=net10.0-ios

      # 4. Build & Publish ra file .ipa dùng net10.0-ios
      - name: Build and Package iOS (.ipa)
        run: |
          dotnet publish UEHTheTeam/UEHTheTeam.csproj \
            -f net10.0-ios \
            -c Release \
            -p:ArchiveOnBuild=true \
            -p:EnableAssemblyAOT=false

      # 5. Gom file .ipa đầu ra
      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App-IPA
          path: |
            **/bin/Release/net10.0-ios/ios-arm64/*.ipa
            **/bin/Release/net10.0-ios/ios-arm64/publish/*.ipa
